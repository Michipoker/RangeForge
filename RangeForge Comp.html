<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rangeforge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #111; display: flex; height: 100vh; user-select: none; }
        
        input, textarea, .combo-note { user-select: text; }
        
        .app-logo { width: 100%; height: auto; aspect-ratio: 354 / 63; max-height: 50px; object-fit: contain; display: block; margin-bottom: 10px; }
        
        #sidebar { width: 230px; background: #fafafa; border-right: 1px solid #f0f0f0; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; }
        #main-area { flex: 1; display: flex; flex-direction: column; border-left: 1px solid #f0f0f0; }
        #top-header { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; background: #fff; min-height: 45px; }
        #spot-input { width: 100%; border: 1px solid #e0e0e0; border-radius: 6px; padding: 5px 8px; font-size: 11px; font-family: 'Inter', sans-serif; }
        #spot-input:focus { outline: none; border-color: #a3c4f3; }
        .add-btn { background: #fff; border: 1px dashed #d0d0d0; color: #888; padding: 4px 7px; border-radius: 6px; font-size: 11px; cursor: pointer; margin-left: 5px; }
        .add-btn:hover { border-color: #a3c4f3; color: #666; }
        #header-breadcrumb { display: none; align-items: center; gap: 4px; margin-left: 12px; font-size: 12px; flex-shrink: 0; }
        .header-tag { font-weight: 500; color: #333; white-space: nowrap; font-size: 12px; }
        .header-sep { color: #ddd; }
        .header-input { border: none; background: transparent; font-size: 12px; color: #666; padding: 0; outline: none; width: auto; font-family: 'Inter', sans-serif; }
        .header-input:focus { color: #333; border-bottom: 1px solid #ccc; }
        #boardExample { border: none; background: transparent; font-size: 12px; font-weight: 700; padding: 0; outline: none; min-width: 30px; font-family: 'Inter', sans-serif; }
        #boardExample:focus { border-bottom: 2px solid #333; }
        #boardExample:empty:before { content: attr(data-placeholder); color: #ddd; pointer-events: none; font-weight: 400; }
        .suit-d { color: #2563eb; font-weight: 700; } .suit-h { color: #dc2626; font-weight: 700; } .suit-s { color: #111; font-weight: 700; } .suit-c { color: #16a34a; font-weight: 700; }
        #spotsList { margin-top: 12px; flex: 1; }
        .spot-item { margin-bottom: 12px; }
        .spot-name { font-size: 11px; font-weight: 600; color: #333; padding: 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .spot-actions { display: flex; align-items: center; gap: 4px; }
        .texture-item { margin-top: 2px; padding: 3px 6px; font-size: 11px; color: #666; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .texture-item:hover { background-color: #f0f0f0; }
        .texture-item.active { background-color: #eff6ff; color: #2563eb; }
        .add-texture { font-size: 9px; color: #aaa; cursor: pointer; margin-top: 2px; padding-left: 6px; }
        .add-texture:hover { color: #2563eb; }
        .del-btn { cursor: pointer; color: #eee; font-size: 12px; font-weight: 300; transition: 0.2s; line-height: 1; }
        .del-btn:hover { color: #e74c3c; }
        #workspace { flex: 1; padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
        #empty-state { color: #ddd; text-align: center; margin-top: 20%; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
        #editor { display: none; flex-direction: row; gap: 10px; flex: 1; min-height: 0; }
        .workspace-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .turn-col, .river-col { border-left: 1px solid #f0f0f0; padding-left: 10px; }
        .flow-row { display: flex; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 3px; }
        .flow-label { font-size: 12px; font-weight: 700; color: #222; margin-right: 6px; width: 30px; text-transform: capitalize; }
        .tabs-container { display: flex; align-items: center; flex: 1; flex-wrap: wrap; }
        .tab-item { font-size: 11px; color: #999; cursor: pointer; padding: 2px 5px; border-radius: 4px; transition: all 0.15s; display: inline-flex; align-items: center; gap: 3px; }
        .tab-item:hover { background-color: #f5f5f5; color: #333; }
        .tab-item.active { background-color: #f5f5f5; color: #111; font-weight: 500; }
        .tab-item.card-tab { font-weight: 600; color: #555; border: 1px solid #eee; }
        .tab-item.card-tab.active { border-color: #333; background-color: #fff; }
        .tab-slash { color: #ddd; margin: 0 1px; pointer-events: none; font-size: 10px; }
        .add-node-btn { font-size: 10px; color: #ccc; cursor: pointer; padding: 2px 5px; border: 1px dashed #e0e0e0; border-radius: 4px; white-space: nowrap; }
        .add-node-btn:hover { color: #333; border-color: #999; }
        .add-card-btn { font-size: 13px; color: #888; cursor: pointer; padding: 2px 6px; border: 1px dashed #d0d0d0; border-radius: 4px; white-space: nowrap; font-weight: 700; }
        .add-card-btn:hover { color: #333; border-color: #999; }
        .micro-btn { font-size: 8px; color: #eee; cursor: pointer; padding: 1px 3px; border: 1px solid #f0f0f0; border-radius: 2px; transition: 0.2s; background: #fff; font-weight: 700; }
        .micro-btn:hover { color: #999; border-color: #ccc; }
        .micro-btn.has-data { color: #aaa; border-color: #ccc; border-style: solid; }
        .add-combo-btn { font-size: 11px; color: #e6d386; background: #fefce8; border: 1px solid #fde68a; cursor: pointer; padding: 1px 4px; border-radius: 3px; transition: 0.2s; font-weight: 600; }
        .add-combo-btn:hover { background: #fef9c3; color: #a16207; border-color: #facc15; }
        .auto-btn { font-size: 9px; color: #999; cursor: pointer; padding: 2px 5px; border: 1px solid #e0e0e0; border-radius: 3px; background: #fff; font-weight: 600; font-family: 'Inter', sans-serif; transition: 0.15s; display: inline-flex; align-items: center; justify-content: center; min-width: 18px; }
        .auto-btn:hover { color: #333; border-color: #999; background: #f7f7f7; }
        .auto-btn:active { transform: translateY(1px); }
        .lock-btn { cursor: pointer; padding: 3px 4px; border: 1px solid #e0e0e0; border-radius: 3px; background: #fff; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; color: #999; }
        .lock-btn:hover { border-color: #999; background: #f7f7f7; color: #666; }
        .lock-btn.locked { color: #dc2626; border-color: #dc2626; background: #fff; }
        .lock-btn svg { width: 10px; height: 10px; }
        .dev-area { flex: 1; background: #fafafa; border: 1px solid #f0f0f0; border-radius: 6px; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; transition: all 0.2s; }
        .dev-area.locked-area { background: #fff5f5 !important; border-color: #fca5a5 !important; }
        .dev-area.locked-area .combo-note { background: transparent; cursor: default; }
        
        .range-summary { display: flex; gap: 10px; padding: 5px 8px; margin: -8px -8px 8px -8px; background: #fff; border-bottom: 1px solid #f0f0f0; font-size: 11px; font-weight: 600; align-items: center; position: sticky; top: 0; z-index: 5; border-radius: 6px 6px 0 0; white-space: nowrap; }
        .range-summary .hit-val { color: #10b981; display: flex; gap: 4px; align-items: center; }
        .range-summary .bluff-val { color: #ef4444; display: flex; gap: 4px; align-items: center; }
        .range-summary .universe-val { color: #999; margin-left: auto; font-weight: 500; font-size: 10px; }
        .range-summary .pct-group { font-size: 9px; color: #999; font-weight: 400; display: flex; gap: 4px; }
        .range-summary .pct-group b { color: #555; font-weight: 600; }

        .combo-row { display: flex; align-items: center; margin-bottom: 1px; padding: 2px 0; border-bottom: 1px solid #f5f5f5; }
        .combo-row:last-child { border-bottom: none; }
        .combo-name { font-size: 11px; color: #111; font-weight: 500; user-select: none; display: flex; align-items: center; gap: 4px; flex-shrink: 0; width: 150px; white-space: nowrap; overflow: hidden; }
        .combo-note { flex: 1; border: none; background: transparent; font-size: 11px; color: #333; outline: none; padding: 3px 6px; margin-left: 6px; border-radius: 4px; font-family: 'Inter', sans-serif; transition: 0.2s; min-height: 16px; border: 1px solid transparent; }
        .combo-note:focus { background: #fff; border-color: #e0e0e0; }
        .combo-note:empty:before { content: attr(data-placeholder); color: #ccc; }
        .combo-auto-single { font-size: 10px; cursor: pointer; color: #bbb; margin-left: auto; padding: 0 3px; border-radius: 2px; transition: 0.15s; }
        .combo-auto-single:hover { color: #2563eb; }
        .combo-del { cursor: pointer; color: #eee; font-size: 10px; margin-left: 4px; font-weight: 300; }
        .combo-del:hover { color: #e74c3c; }
        .context-inline { font-size: 10px; color: #aaaaaa; white-space: nowrap; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 380px; max-height: 90vh; overflow-y: auto; }
        .modal-box input[type="text"] { width: 100%; border: 1px solid #e0e0e0; padding: 8px; font-size: 12px; margin-bottom: 15px; outline: none; border-radius: 4px; font-family: 'Inter', sans-serif; }
        .modal-box input[type="text"]:focus { border-color: #a3c4f3; }
        #modal-nota .modal-box { width: 30vw; height: 90vh; display: flex; flex-direction: column; padding: 15px; }
        #note-textarea { flex: 1; border: none; background: #fafafa; font-size: 13px; padding: 15px; margin-bottom: 15px; outline: none; border-radius: 4px; font-family: 'Inter', sans-serif; overflow-y: auto; color: #333; line-height: 1.5; white-space: pre-wrap; }
        #note-textarea:focus { background: #fff; border: 1px solid #e0e0e0; }
        #note-textarea:empty:before { content: attr(data-placeholder); color: #bbb; pointer-events: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
        .modal-btn { padding: 5px 10px; border: 1px solid #e0e0e0; background: #fff; font-size: 11px; cursor: pointer; border-radius: 4px; }
        .modal-btn.primary { background: #333; color: #fff; border-color: #333; }
        .modal-btn.danger { background: #fff; color: #e74c3c; border-color: #e74c3c; }
        .quick-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .quick-item { font-size: 11px; color: #555; border: 1px solid #eee; padding: 5px 10px; border-radius: 20px; cursor: pointer; transition: 0.2s; }
        .quick-item:hover { border-color: #333; color: #111; }
        #modal-img .modal-box { width: 95vw; height: 95vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: rgba(0,0,0,0.9); border: none; }
        #img-preview { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 4px; }
        .combo-check-list { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; margin-bottom: 15px; padding-right: 8px; }
        .combo-check-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #333; cursor: pointer; padding: 5px; border-radius: 4px; border: 1px solid #fff; transition: 0.15s; }
        .combo-check-item:hover { background: #f5f5f5; border-color: #eee; }
        .combo-check-item input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; accent-color: #333; }
        .db-actions { margin-top: auto; padding-top: 12px; border-top: 1px solid #f0f0f0; display: flex; flex-direction: column; gap: 5px; }
        .db-btn { width: 100%; background: #fff; border: 1px solid #e0e0e0; padding: 6px; font-size: 11px; cursor: pointer; border-radius: 4px; text-align: center; font-family: 'Inter', sans-serif; color: #111; transition: 0.2s; font-weight: 600; }
        .db-btn:hover { background: #f5f5f5; border-color: #ccc; color: #111; }
        .db-btn.migrate { color: #2563eb; border-color: #bfdbfe; background: #eff6ff; font-weight: 500; }
        .db-btn.migrate:hover { background: #dbeafe; border-color: #93c5fd; }
        .combo-toggle { font-size: 7px; color: #ddd; cursor: pointer; width: 10px; text-align: center; flex-shrink: 0; transition: color 0.15s; line-height: 1; }
        .combo-toggle:hover { color: #999; }
        .combo-toggle.open { color: #888; }
        .combo-expand { padding: 4px 0 4px 14px; border-bottom: 1px solid #f0f0f0; margin-bottom: 2px; }
        .cards-row { display: flex; flex-wrap: wrap; gap: 3px; align-items: flex-end; }
        .add-card-inline { width: 34px; height: 24px; border: 1px dashed #e0e0e0; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #ddd; cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
        .add-card-inline:hover { border-color: #aaa; color: #888; }
        :root { --card-h: #fca5a5; --card-d: #93c5fd; --card-c: #86efac; --card-s: #d1d5db; }
        .mini-combo { display: inline-flex; gap: 1px; cursor: pointer; border-radius: 3px; padding: 0; border: none; transition: all 0.12s; flex-shrink: 0; }
        .mini-combo:hover { background: #eee; }
        .mini-combo.sel { border: 0.8px solid #000; }
        .mc { width: 12px; height: 18px; border: 0.3px solid #000; border-radius: 3px; display: flex; align-items: center; justify-content: center; line-height: 1; transition: all 0.12s; font-size: 10px; font-weight: 400; color: #000; background: #fff; }
        .mc-rank { font-size: 10px; }
        .mc.ch { background: var(--card-h); } .mc.cd { background: var(--card-d); } .mc.cc { background: var(--card-c); } .mc.cs { background: var(--card-s); }
        .board-card { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 2px; font-size: 10px; font-weight: 700; color: #111; margin: 0 1px; vertical-align: middle; line-height: 1; }
        .board-card.suit-h { background: var(--card-h); } .board-card.suit-d { background: var(--card-d); } .board-card.suit-c { background: var(--card-c); } .board-card.suit-s { background: var(--card-s); }
        .tab-item .mc { margin: 0; flex-shrink: 0; }
        .board-display { display: inline-flex; align-items: center; gap: 2px; min-height: 22px; min-width: 30px; padding: 0 2px; }
        .board-display .mc { width: 18px; height: 22px; cursor: pointer; position: relative; }
        .board-display .mc:hover::after { content: "×"; position: absolute; top: -5px; right: -3px; color: #c33; font-size: 11px; font-weight: 800; line-height: 1; }
        .board-display .ph { color: #ccc; font-size: 11px; font-weight: 400; font-style: italic; }
        
        #modal-pickcard .modal-box { width: auto; min-width: 340px; padding: 20px; }
        .pc-grid { display: inline-grid; grid-template-columns: repeat(13, 28px); gap: 4px; justify-content: center; }
        .pc-cell { width: 28px; height: 34px; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.12s; position: relative; border: 2px solid transparent; }
        .pc-cell .pc-rank { font-size: 13px; font-weight: 700; color: #111; }
        .pc-cell.ch { background: var(--card-h); } .pc-cell.cd { background: var(--card-d); } .pc-cell.cc { background: var(--card-c); } .pc-cell.cs { background: var(--card-s); }
        .pc-cell:hover { transform: scale(1.12); box-shadow: 0 2px 5px rgba(0,0,0,0.18); z-index: 2; }
        .pc-cell.selected { border-color: #6366f1; background-color: #eef2ff !important; box-shadow: 0 0 0 2px #c7d2fe; transform: scale(1.05); z-index: 2; }
        .pc-cell.selected .pc-rank { color: #4f46e5; }
        .pc-cell.dead { opacity: 0.2; cursor: not-allowed; filter: grayscale(1); }
        .pc-cell.dead:hover { transform: none; box-shadow: none; }
        .pc-cell.dead::after { content: "✕"; position: absolute; color: #c33; font-size: 14px; font-weight: 800; }
        
        /* --- VENTANA PANEL COMBOS (ESTILO FIGMA) --- */
        #card-modal .modal-box {
            width: 715px; height: 565px; max-width: none; max-height: none;
            border: 0.8px solid #7C3C3C; border-radius: 8px; background: #fff;
            padding: 20px; display: flex; flex-direction: column;
        }
        .cm-modal-title {
            font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; color: #000;
            background: #EEEEEE; border-radius: 5px; padding: 3px; text-align: center; margin-bottom: 15px;
        }
        .cm-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-shrink: 0; }
        .cm-tab {
            font-family: 'Inter', sans-serif; font-weight: 700; font-size: 10px; color: #000;
            background: transparent; border: none; padding: 2px; cursor: pointer; border-radius: 3px;
        }
        .cm-tab.active { background: #FFF396; }
        .cm-layout { flex: 1; display: flex; gap: 20px; overflow: hidden; }
        .cm-left { flex: 0 0 300px; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #EEEEEE; padding-right: 20px; }
        .cm-right { flex: 1; display: flex; flex-direction: column; padding-left: 5px; }
        
        .cm-grid { display: grid; grid-template-columns: repeat(13, 20px); gap: 2px; margin-bottom: 15px; }
        .cm-cell {
            width: 20px; height: 20px; border: 0.8px solid #000; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 400;
            background: #fff; color: #000; cursor: pointer; transition: 0.1s;
        }
        .cm-cell:hover { background: #f0f0f0; }
        .cm-cell.active, .cm-cell.has-s, .cm-cell.has-o, .cm-cell.has-p { background: #FFF396; }
        .cm-cell.deleted { background: #000; color: #EEEEEE; pointer-events: none; }
        .cm-cell.disabled { opacity: 0.1; pointer-events: none; }
        
        .cm-quick-actions { display: flex; gap: 5px; margin-bottom: 15px; }
        .cm-qbtn {
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 10px; color: #000;
            background: #fff; border: 0.8px solid #000; padding: 2px 8px; border-radius: 4px; cursor: pointer;
        }
        .cm-qbtn:hover { background: #f0f0f0; }
        
        .cm-matrix-wrap { border: none; background: transparent; padding: 0; margin-top: auto; }
        .cm-matrix { display: grid; grid-template-columns: 20px repeat(4, 20px); gap: 3px; align-items: center; justify-items: center; }
        .cm-mh { font-size: 14px; font-weight: 700; text-align: center; }
        .cm-mcell {
            width: 20px; height: 20px; border: 0.8px solid #000; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 8px;
            background: #fff; cursor: pointer;
        }
        .cm-mcell.sel { background: #FFF396; }
        .cm-mcell.dead { background: #000; color: #000; pointer-events: none; }
        
        .cm-context-label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 10px; color: #000; margin-bottom: 5px; }
        .cm-context-value { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 10px; color: #000; }
        .cm-board-context { display: flex; align-items: center; gap: 5px; margin-bottom: 15px; }
        .cm-panel-title { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; color: #000; margin-bottom: 8px; }
        .cm-hand-label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 10px; color: #000; margin-bottom: 2px; }
        .cm-sel-empty { width: 100%; font-size: 10px; color: #ccc; text-align: center; padding: 20px 0; font-style: italic; }
        
        .cm-close-btn {
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 10px; color: #000;
            background: #EEEEEE; border: none; padding: 3px 12px; border-radius: 5px; cursor: pointer;
            align-self: flex-end; margin-top: 10px;
        }
        /* --------------------------------------- */

        /* --- Modal Rango Preflop --- */
        #modal-range .modal-box { width: 700px; padding: 20px; display: flex; flex-direction: column; }
        #rm-layout { display: flex; gap: 15px; flex: 1; min-height: 350px; }
        #rm-lib { width: 220px; border-right: 1px solid #eee; padding-right: 10px; display: flex; flex-direction: column; }
        #rm-lib-title { font-size: 11px; font-weight: 600; color: #333; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
        #rm-lib-actions { display: flex; gap: 5px; }
        #rm-lib-list { flex: 1; overflow-y: auto; font-size: 11px; }
        .lib-cat { font-weight: 600; padding: 4px 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .lib-cat:hover { background: #f0f0f0; }
        .lib-cat.active { background: #eef2ff; color: #6366f1; }
        .lib-range { padding: 3px 6px 3px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .lib-range:hover { background: #f0f0f0; }
        .lib-del-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 10px; padding: 0; line-height: 1; }
        .lib-del-btn:hover { color: #e74c3c; }
        #rm-main { flex: 1; display: flex; flex-direction: column; align-items: center; }
        #rm-grid { display: inline-grid; grid-template-columns: repeat(13, 26px); gap: 2px; justify-content: center; margin-top: 10px; user-select: none; }
        .rm-cell { width: 26px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; cursor: pointer; border: 1px solid #e0e0e0; background: #fafafa; color: #ccc; border-radius: 2px; transition: all 0.1s; }
        .rm-cell:hover { background: #f0f0f0; color: #666; }
        .rm-cell.active { background: #eef2ff; color: #6366f1; border-color: #c7d2fe; box-shadow: inset 0 0 0 1px #c7d2fe; }

</head>

    <script>
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);

        const DB_V3 = 'poker_app_v12_FIX';
        const DB_KEY = 'poker_app_v4';
        let data = { spots: [], library: [] };
        let aS = -1, aT = -1, aF = -1, aTC = -1, aTA = -1, aRC = -1, aRA = -1;
        let mTarget = '', currentEditType = '';
        let cmCtx = null, cmHand = null;
        let cmValidCombosSet = null; 
        const COMBOS_MASTER = [{id:'quads',name:'Quads',sort:1},{id:'fh',name:'Full house',sort:2},{id:'flush',name:'Flush',sort:3},{id:'straight',name:'Straight',sort:4},{id:'set',name:'Set',sort:5},{id:'trip',name:'Trip',sort:6},{id:'two-pair',name:'Two pair',sort:7},{id:'overpair',name:'Overpair',sort:8},{id:'top-pair',name:'Top pair',sort:9},{id:'pp-below-tp',name:'PP below TP',sort:10},{id:'mid-pair',name:'Middle pair',sort:11},{id:'pp-below-mp',name:'PP below MP',sort:12},{id:'3rd-pair',name:'3rd pair',sort:13},{id:'pp-below-3rd',name:'PP below 3rd',sort:14},{id:'ace-high',name:'Ace high',sort:15},{id:'nmh',name:'NMH',sort:16},{id:'fd-2',name:'FD (2crd)',sort:17},{id:'fd-1',name:'FD (1crd)',sort:18},{id:'oesd-2',name:'OESD (2crd)',sort:19},{id:'oesd-1',name:'OESD (1crd)',sort:20},{id:'gs-2',name:'GS (2crd)',sort:21},{id:'gs-1',name:'GS (1crd)',sort:22},{id:'overcards',name:'Overcards',sort:23},{id:'bdfd',name:'BDFD',sort:24},{id:'air',name:'Air',sort:26}];
        const RANKS = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
        const SUITS = ['h','d','c','s'];
        const SYM = { h:'♥', d:'♦', c:'♣', s:'♠' };

        const HIT_CATS = ['quads', 'fh', 'flush', 'straight', 'set', 'trip', 'two-pair', 'overpair', 'top-pair', 'pp-below-tp', 'mid-pair', 'pp-below-mp', '3rd-pair', 'pp-below-3rd'];
        const BLUFF_CATS = ['fd-2', 'fd-1', 'oesd-2', 'oesd-1', 'gs-2', 'gs-1', 'bdfd', 'overcards', 'air', 'nmh', 'ace-high'];

        const lockSvgOpen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>';
        const lockSvgClosed = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';

        function suitCombos(hand) {
            const r1 = hand[0], r2 = hand[1], out = [];
            if (r1 === r2) {
                for (let i = 0; i < 4; i++)
                    for (let j = i + 1; j < 4; j++)
                        out.push({ id: r1+SUITS[i]+r2+SUITS[j], s1: SUITS[i], s2: SUITS[j], g: 'p' });
            } else {
                for (let i = 0; i < 4; i++)
                    out.push({ id: r1+SUITS[i]+r2+SUITS[i], s1: SUITS[i], s2: SUITS[i], g: 's' });
                for (let i = 0; i < 4; i++)
                    for (let j = 0; j < 4; j++)
                        if (i !== j)
                            out.push({ id: r1+SUITS[i]+r2+SUITS[j], s1: SUITS[i], s2: SUITS[j], g: 'o' });
            }
            return out;
        }
        function getDeadCards() {
            const dead = new Set();
            const addFromText = (txt) => {
                if (!txt) return;
                const matches = String(txt).match(/[KQJTA2-9][dhsc]/gi) || [];
                matches.forEach(m => dead.add(m.toLowerCase()));
            };
            if (aS === -1 || aT === -1) return dead;
            const tex = data.spots[aS].textures[aT];
            if(!tex) return dead;
            addFromText(tex.board);
            if (aF !== -1) {
                const fnode = tex.flopNodes[aF];
                if (!fnode) return dead;
                if (aTC !== -1 && fnode.turnCards && fnode.turnCards[aTC]) {
                    addFromText(fnode.turnCards[aTC].name);
                    if (aTA !== -1 && fnode.turnCards[aTC].turnActions && fnode.turnCards[aTC].turnActions[aTA]) {
                        if (aRC !== -1 && fnode.turnCards[aTC].turnActions[aTA].riverCards && fnode.turnCards[aTC].turnActions[aTA].riverCards[aRC]) {
                            addFromText(fnode.turnCards[aTC].turnActions[aTA].riverCards[aRC].name);
                        }
                    }
                }
            }
            return dead;
        }
        function getHands(c) { if (!c.hands) c.hands = []; return c.hands; }
        function findOrCreateHand(c, hand) {
            let h = getHands(c).find(x => x.hand === hand);
            if (!h) { h = { hand, selected: [] }; c.hands.push(h); }
            return h;
        }
        function getAllSelected(c) {
            const all = [];
            getHands(c).forEach(h => (h.selected||[]).forEach(sid => all.push(sid)));
            return all;
        }
        function getAllSelectedFromNode(node) {
            const all = [];
            if (!node || !node.combos) return all;
            node.combos.forEach(c => {
                (c.hands||[]).forEach(h => {
                    (h.selected||[]).forEach(sid => all.push(sid));
                });
            });
            return all;
        }
        function removeCombo(c, sid) {
            getHands(c).forEach(h => {
                const i = h.selected.indexOf(sid);
                if (i >= 0) h.selected.splice(i, 1);
            });
            c.hands = c.hands.filter(h => h.selected && h.selected.length > 0);
        }
        
        window.onload = () => { 
            const s = localStorage.getItem(DB_KEY); 
            if(s) try { 
                data = JSON.parse(s); 
                if (!data.spots || !Array.isArray(data.spots)) data.spots = [];
                if (!data.library || !Array.isArray(data.library)) data.library = [];
                if (data.library.length > 0 && data.library[0] && data.library[0].category === undefined) {
                    let oldLib = data.library;
                    data.library = [{ category: "General", ranges: [] }];
                    oldLib.forEach(item => {
                        if (item && item.name) {
                            data.library[0].ranges.push({ name: item.name, value: item.value || "" });
                        }
                    });
                }
            } catch(e){ 
                data = { spots: [], library: [] };
            } 
            renderSidebar(); 
        };
        function commit(force) { localStorage.setItem(DB_KEY, JSON.stringify(data)); if(!force) renderSidebar(); }
        function exportData() { let blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"}); let a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Poker_V4_" + new Date().toISOString().slice(0,10) + ".json"; a.click(); }
        function importData(event) { let file = event.target.files[0]; if(!file) return; let reader = new FileReader(); reader.onload = function(e) { try { if(confirm("¿Reemplazar información actual?")) { data = JSON.parse(e.target.result); if(!data.library || !Array.isArray(data.library)) data.library = []; commit(true); clearAll(); renderSidebar(); } } catch(err) { alert("Error: Archivo no válido."); } }; reader.readAsText(file); event.target.value = ''; }
        function saveTexts() { if(aS===-1||aT===-1) return; let t=data.spots[aS].textures[aT]; t.name=document.getElementById('textureHeader').value; commit(); }
        function addSpot() { const n=document.getElementById('spot-input').value.trim(); if(!n) return; data.spots.push({name:n, textures:[], preflopRange: []}); document.getElementById('spot-input').value=''; commit(); }
        function delSpot(i) { if(confirm('¿Borrar spot?')){ data.spots.splice(i,1); if(aS===i){aS=-1; aT=-1; clearAll();} else if(aS>i){aS--;} commit(); } }
        function delTexture(i) { if(confirm('¿Borrar textura?')){ data.spots[aS].textures.splice(i,1); if(aT===i){aT=-1; clearAll();} else if(aT>i){aT--;} commit(); } }
        function addTexture() { const n=prompt("Nombre de la textura:"); if(!n) return; data.spots[aS].textures.push({name:n, board:'', flopNodes:[]}); commit(); loadTexture(data.spots[aS].textures.length-1); }
        function loadTexture(i) { aS = aS===-1?0:aS; aT=i; aF=-1; let t=data.spots[aS].textures[i]; document.getElementById('empty-state').style.display='none'; document.getElementById('editor').style.display='flex'; document.getElementById('header-breadcrumb').style.display='flex'; document.getElementById('spotHeader').innerText=data.spots[aS].name; document.getElementById('textureHeader').value=t.name; renderBoard(); renderFlopTabs(); if(t.flopNodes.length>0) selectFlop(0); else clearWorkspace(); }
        
        function renderSidebar() { 
            const l = document.getElementById('spotsList'); 
            let html = ''; 
            if(!data.spots) data.spots = [];
            data.spots.forEach((s, i) => { 
                const hasRange = s.preflopRange && s.preflopRange.length > 0;
                html += `<div class="spot-item"><div class="spot-name"><span>${s.name}</span><div class="spot-actions"><div class="micro-btn ${hasRange?'has-data':''}" onclick="event.stopPropagation(); openRangeModal(${i})" title="Rango preflop">R</div><span class="del-btn" onclick="event.stopPropagation(); delSpot(${i})">×</span></div></div>`; 
                s.textures.forEach((t, j) => { 
                    let ac = (i === aS && j === aT) ? 'active' : ''; 
                    html += `<div class="texture-item ${ac}" onclick="aS=${i}; loadTexture(${j})"><span>${t.name}</span><span class="del-btn" onclick="event.stopPropagation(); delTexture(${j})">×</span></div>`; 
                }); 
                html += `<div class="add-texture" onclick="aS=${i}; addTexture()">+ añadir textura</div></div>`; 
            }); 
            l.innerHTML = html; 
        }

        // --- Lógica Rango Preflop ---
        let rangeSpotIdx = -1;
        let rmDragModeAdd = false;
        let rmMouseDown = false;
        let tempPreflopRange = []; 
        let selectedLibCat = -1;

        function openRangeModal(idx) {
            rangeSpotIdx = idx;
            if (!data.spots[idx].preflopRange) data.spots[idx].preflopRange = [];
            tempPreflopRange = [...data.spots[idx].preflopRange];
            selectedLibCat = -1;
            renderLibrary();
            updateRangeInputText();
            renderRangeGrid();
            document.getElementById('modal-range').style.display = 'flex';
        }

        function renderRangeGrid() {
            const rangeSet = new Set(tempPreflopRange);
            let html = '<div id="rm-grid">';
            RANKS.forEach((r1, i) => {
                RANKS.forEach((r2, j) => {
                    let hand, type, label;
                    if (i === j) { hand = r1+r2; type = 'p'; label = hand; }
                    else if (i < j) { hand = r1+r2; type = 's'; label = hand+'s'; }
                    else { hand = r2+r1; type = 'o'; label = hand+'o'; }
                    const key = hand + type;
                    const active = rangeSet.has(key);
                    html += `<div class="rm-cell ${active?'active':''}" data-key="${key}" onmousedown="rmCellDown(event,'${key}')" onmouseover="rmCellOver(event,'${key}')" onmouseup="rmCellUp(event)">${label}</div>`;
                });
            });
            html += '</div>';
            document.getElementById('rm-grid').outerHTML = html;
            const totalCombos = countCombosInRange(tempPreflopRange);
            document.getElementById('rm-info').textContent = `${tempPreflopRange.length} manos (${totalCombos} combos)`;
        }

        function countCombosInRange(rangeArr) {
            let count = 0;
            rangeArr.forEach(key => {
                const r1 = key[0], r2 = key[1];
                const isPair = r1 === r2;
                if (isPair) count += 6;
                else count += (key[2] === 's' ? 4 : 12);
            });
            return count;
        }

        function rmCellDown(e, key) { rmMouseDown = true; const set = new Set(tempPreflopRange); rmDragModeAdd = !set.has(key); rmApplyAction(key); e.preventDefault(); }
        function rmCellOver(e, key) { if (rmMouseDown) rmApplyAction(key); }

        function parseRangeInput() {
            const text = document.getElementById('rm-input').value.toUpperCase();
            const rangeSet = new Set();
            if (!text.trim()) { tempPreflopRange = []; renderRangeGrid(); return; }
            const tokens = text.split(',');
            tokens.forEach(t => {
                t = t.trim(); if (t.length < 2) return;
                if (t.includes('-')) {
                    const parts = t.split('-');
                    if (parts.length === 2) {
                        const a = parts[0].trim(); const b = parts[1].trim();
                        if (a.length === 2 && a[0] === a[1] && b.length === 2 && b[0] === b[1]) {
                            const r1 = a[0], r2 = b[0]; const i1 = RANKS.indexOf(r1); const i2 = RANKS.indexOf(r2);
                            const min = Math.min(i1, i2), max = Math.max(i1, i2);
                            for (let i = min; i <= max; i++) { rangeSet.add(RANKS[i] + RANKS[i] + 'p'); }
                        } else if (a.length >= 3 && b.length >= 3) {
                            const r1 = a[0], r2 = b[0]; const suffix = a[a.length-1];
                            if (r1 === r2 && (suffix === 'S' || suffix === 'O')) {
                                const c1 = a[1]; const c2 = b[1]; const i1 = RANKS.indexOf(c1); const i2 = RANKS.indexOf(c2);
                                if (i1 !== -1 && i2 !== -1) {
                                    const min = Math.min(i1, i2), max = Math.max(i1, i2);
                                    const g = suffix === 'S' ? 's' : 'o';
                                    for (let i = min; i <= max; i++) { if (RANKS[i] !== r1) { rangeSet.add(r1 + RANKS[i] + g); } }
                                }
                            }
                        }
                    }
                } else {
                    const r1 = t[0], r2 = t[1];
                    if (!RANKS.includes(r1) || !RANKS.includes(r2)) return;
                    const isPair = r1 === r2;
                    if (isPair) { rangeSet.add(r1 + r2 + 'p'); } 
                    else {
                        const suffix = t.length > 2 ? t[2] : 's';
                        if (suffix.toUpperCase() === 'O') { rangeSet.add(r1 + r2 + 'o'); } 
                        else { rangeSet.add(r1 + r2 + 's'); }
                    }
                }
            });
            tempPreflopRange = Array.from(rangeSet); renderRangeGrid();
        }

        function generateRangeString(rangeArr) {
            const rangeSet = new Set(rangeArr); let parts = [];
            let pStart = -1;
            for (let i = 0; i < 13; i++) {
                const r = RANKS[i];
                if (rangeSet.has(r + r + 'p')) { if (pStart === -1) pStart = i; } 
                else { if (pStart !== -1) { if (i - 1 === pStart) parts.push(RANKS[pStart] + RANKS[pStart]); else parts.push(RANKS[pStart] + RANKS[pStart] + '-' + RANKS[i-1] + RANKS[i-1]); pStart = -1; } }
            }
            if (pStart !== -1) { if (12 === pStart) parts.push(RANKS[pStart] + RANKS[pStart]); else parts.push(RANKS[pStart] + RANKS[pStart] + '-' + RANKS[12] + RANKS[12]); }
            ['s', 'o'].forEach(g => {
                for (let i = 0; i < 13; i++) {
                    let sStart = -1;
                    for (let j = i + 1; j < 13; j++) {
                        const key = RANKS[i] + RANKS[j] + g;
                        if (rangeSet.has(key)) { if (sStart === -1) sStart = j; } 
                        else { if (sStart !== -1) { if (j - 1 === sStart) parts.push(RANKS[i] + RANKS[sStart] + g); else parts.push(RANKS[i] + RANKS[sStart] + g + '-' + RANKS[i] + RANKS[j-1] + g); sStart = -1; } }
                    }
                    if (sStart !== -1) { if (12 === sStart) parts.push(RANKS[i] + RANKS[sStart] + g); else parts.push(RANKS[i] + RANKS[sStart] + g + '-' + RANKS[i] + RANKS[12] + g); }
                }
            });
            return parts.join(',');
        }

        function cmToggleHand(hand, group) { let key = hand + (group === 'p' ? '' : group); const idx = cmSelectedHands.indexOf(key); if (idx >= 0) cmSelectedHands.splice(idx, 1); else cmSelectedHands.push(key); cmRefreshGridActive(); cmRenderChips(); }
        function cmRefreshGridActive() { const set = new Set(cmSelectedHands); document.querySelectorAll('#cm-grid .cm-cell').forEach(el => { if (!el.classList.contains('deleted')) el.classList.toggle('active', set.has(el.dataset.key)); }); }
        function cmRefreshGridData() { if (!cmCtx) return; const c = cmCurrentCombo(); const byHand = {}; (c.hands||[]).forEach(h => { if (!h.selected || h.selected.length === 0) return; const hand = h.hand; const isPair = (hand[0] === hand[1]); const groups = { s: false, o: false, p: false }; h.selected.forEach(id => { const s1 = id.charAt(1).toLowerCase(), s2 = id.charAt(3).toLowerCase(); if (isPair) groups.p = true; else if (s1 === s2) groups.s = true; else groups.o = true; }); byHand[hand] = groups; }); document.querySelectorAll('#cm-grid .cm-cell').forEach(el => { if (el.classList.contains('deleted')) return; const hand = el.dataset.hand, grp = el.dataset.grp, g = byHand[hand]; el.classList.toggle('has-s', grp === 's' && !!(g && g.s)); el.classList.toggle('has-o', grp === 'o' && !!(g && g.o)); el.classList.toggle('has-p', grp === 'p' && !!(g && g.p)); }); }
        function cmRenderChips() { cmRenderMatrix(); cmRenderSelPanel(); }

        function cmRenderSelPanel() {
            const panel = document.getElementById('cm-sel-panel');
            if (!panel) return;
            const c = cmCurrentCombo();
            const savedHands = (c.hands || []).filter(h => h.selected && h.selected.length > 0);
            const board = getActiveBoard(cmCtx.type) || [];
            
            let html = `<div style="margin-bottom: 10px;">`;
            html += `<div class="cm-context-label">Estas en: <span class="cm-context-value">${c.name}</span></div>`;
            html += `<div class="cm-context-label" style="display: flex; align-items: center; gap: 4px;">Board: `;
            if (board.length === 0) html += '<span style="color:#ccc; font-size:12px; font-style:italic;">—</span>';
            else board.forEach(card => { html += `<div class="mc c${card[1]}" style="width:14px; height:20px; font-size:11px;">${card[0].toUpperCase()}</div>`; });
            html += `</div></div>`;
            
            html += `<div class="cm-panel-title">Manos Agregadas</div>`;
            html += `<div class="cm-hands-list">`;
            if (savedHands.length === 0) {
                html += '<div class="cm-sel-empty">Aún no has guardado combos.<br><br>Usa la matriz 4x4 para agregar.</div>';
            } else {
                savedHands.sort((a,b) => a.hand.localeCompare(b.hand));
                savedHands.forEach(h => {
                    const handStr = h.hand, r1 = handStr[0], r2 = handStr[1], isPair = (r1 === r2);
                    let suited = h.selected.filter(id => (id[1] === id[3]) || isPair);
                    let offsuit = h.selected.filter(id => (id[1] !== id[3]) && !isPair);
                    
                    if (suited.length > 0) {
                        html += `<div style="margin-bottom: 5px;"><div class="cm-hand-label">${isPair ? handStr : handStr+'s'}</div><div style="display: flex; flex-wrap: wrap; gap: 2px;">`;
                        suited.forEach(id => { html += `<div class="mini-combo sel" oncontextmenu="event.preventDefault();event.stopPropagation();cmRemoveSavedCombo('${id}')"><div class="mc c${id[1]}">${id[0]}</div><div class="mc c${id[3]}">${id[2]}</div></div>`; });
                        html += `</div></div>`;
                    }
                    if (offsuit.length > 0) {
                        html += `<div style="margin-bottom: 5px;"><div class="cm-hand-label">${handStr+'o'}</div><div style="display: flex; flex-wrap: wrap; gap: 2px;">`;
                        offsuit.forEach(id => { html += `<div class="mini-combo sel" oncontextmenu="event.preventDefault();event.stopPropagation();cmRemoveSavedCombo('${id}')"><div class="mc c${id[1]}">${id[0]}</div><div class="mc c${id[3]}">${id[2]}</div></div>`; });
                        html += `</div></div>`;
                    }
                });
            }
            html += `</div>`;
            panel.innerHTML = html;
        }
        
        function cmRemoveSavedCombo(id) { const c = cmCurrentCombo(); removeCombo(c, id); cmRefreshGridData(); cmRenderMatrix(); renderCombosUI(cmCtx.cid, getNodeByType(cmCtx.type).combos, cmCtx.type); commit(); cmRenderSelPanel(); }

        function cmRenderMatrix() {
            const wrap = document.getElementById('cm-matrix-wrap');
            let html = '<div class="cm-matrix">';
            html += '<div></div>'; SUITS.forEach(s => html += `<div class="cm-mh">${SUIT_GLYPH[s]}</div>`);
            SUITS.forEach((sRow, i) => {
                html += `<div class="cm-mh">${SUIT_GLYPH[sRow]}</div>`;
                SUITS.forEach((sCol, j) => {
                    let classes = ['cm-mcell']; const status = cmCellStatus(i, j);
                    if (status === 'dead') classes.push('dead');
                    else if (status === 'sel') classes.push('sel');
                    const clickable = status !== 'dead';
                    const onclick = clickable ? ` onclick="cmToggleCell(${i},${j})"` : '';
                    html += `<div class="${classes.join(' ')}"${onclick}>${SUIT_GLYPH[sRow]}${SUIT_GLYPH[sCol]}</div>`;
                });
            });
            html += '</div>';
            wrap.innerHTML = html;
        }
        function cmCellStatus(i, j) {
            let effHands = cmSelectedHands.length > 0 ? cmSelectedHands.filter(k => (k.length>2?k[2]:'p') === cmActiveTab).map(k => k.slice(0,2)) : [];
            if(effHands.length === 0) return 'inactive';
            const c = cmCurrentCombo(); let app = 0, sel = 0;
            effHands.forEach(hand => { if (!cmCellAppliesToTab(i, j, hand, cmActiveTab)) return; const id = cmComboIdForCell(hand, i, j); if (!id || cmIsComboDead(id) || cmIsComboInvalidForCategory(id)) return; app++; const hd = (c.hands||[]).find(x => x.hand === hand); if (hd && hd.selected && hd.selected.includes(id)) sel++; });
            if (app === 0) return 'dead'; if (sel === app) return 'sel'; if (sel > 0) return 'partial'; return 'default';
        }
        function cmToggleCell(i, j) {
            const status = cmCellStatus(i, j); if (status === 'dead') return; const turnOn = status !== 'sel'; const c = cmCurrentCombo();
            let effHands = cmSelectedHands.length > 0 ? cmSelectedHands.filter(k => (k.length>2?k[2]:'p') === cmActiveTab).map(k => k.slice(0,2)) : [];
            effHands.forEach(hand => { if (!cmCellAppliesToTab(i, j, hand, cmActiveTab)) return; const id = cmComboIdForCell(hand, i, j); if (!id || cmIsComboDead(id) || cmIsComboInvalidForCategory(id)) return; const hd = findOrCreateHand(c, hand); if (!hd.selected) hd.selected = []; const idx = hd.selected.indexOf(id); if (turnOn && idx < 0) hd.selected.push(id); else if (!turnOn && idx >= 0) hd.selected.splice(idx, 1); });
            cmRefreshGridData(); cmRenderMatrix(); renderCombosUI(cmCtx.cid, getNodeByType(cmCtx.type).combos, cmCtx.type); commit(); cmRenderSelPanel();
        }
        function cmQuickTabAll() { const c = cmCurrentCombo(); let effHands = cmSelectedHands.map(k => k.slice(0,2)); effHands.forEach(hand => { if (cmActiveTab === 'p' && hand[0] !== hand[1]) return; if (cmActiveTab !== 'p' && hand[0] === hand[1]) return; const hd = findOrCreateHand(c, hand); if (!hd.selected) hd.selected = []; suitCombos(hand).forEach(sc => { if (cmActiveTab === sc.g) { if (cmIsComboDead(sc.id) || cmIsComboInvalidForCategory(sc.id)) return; if (!hd.selected.includes(sc.id)) hd.selected.push(sc.id); } }); }); cmRefreshGridData(); cmRenderMatrix(); renderCombosUI(cmCtx.cid, getNodeByType(cmCtx.type).combos, cmCtx.type); commit(); cmRenderSelPanel(); }
        function cmQuickNone() { const c = cmCurrentCombo(); let effHands = cmSelectedHands.map(k => k.slice(0,2)); effHands.forEach(hand => { if (cmActiveTab === 'p' && hand[0] !== hand[1]) return; if (cmActiveTab !== 'p' && hand[0] === hand[1]) return; const hd = findOrCreateHand(c, hand); if (!hd.selected) hd.selected = []; hd.selected = hd.selected.filter(id => cmActiveTab !== sc.g); }); cmRefreshGridData(); cmRenderMatrix(); renderCombosUI(cmCtx.cid, getNodeByType(cmCtx.type).combos, cmCtx.type); commit(); cmRenderSelPanel(); }

        function closeCardModal() { document.getElementById('card-modal').style.display = 'none'; if (cmCtx) { let node = getNodeByType(cmCtx.type); node.combos[cmCtx.ci].hands = (node.combos[cmCtx.ci].hands||[]).filter(h => h.selected && h.selected.length > 0); renderCombosUI(cmCtx.cid, node.combos, cmCtx.type); commit(); } cmCtx = null; cmSelectedHands = []; }

        function openComboModal(type) { 
            if (isNodeLocked(type)) return alert('Desbloquea el nodo.'); currentEditType=type; let node=getNodeByType(type); if (!node) return; if (!node.combos) node.combos = [];
            let existingIds=node.combos.map(c=>c.id); let available=COMBOS_MASTER.filter(m=>!existingIds.includes(m.id)).sort((a,b)=>a.sort-b.sort); 
            let html=''; available.forEach(m=>{html+=`<label class="combo-check-item"><input type="checkbox" value="${m.id}">${m.name}</label>`;}); 
            if(!html) html='<p style="color:#aaa;text-align:center">Todas agregadas.</p>'; 
            document.getElementById('combo-check-list').innerHTML=html; document.getElementById('modal-combos').style.display='flex'; 
        }
        function confirmAddCombos() { let cbs=document.querySelectorAll('#combo-check-list input[type="checkbox"]:checked'); let node=getNodeByType(currentEditType); cbs.forEach(cb=>{let m=COMBOS_MASTER.find(x=>x.id===cb.value);if(m) node.combos.push({id:m.id, name:m.name, sort:m.sort, note:""});}); let idMap = {'flop':'flop-combos-container', 'turnAction':'turn-combos-container', 'riverAction':'river-combos-container'}; renderCombosUI(idMap[currentEditType], node.combos, currentEditType); commit(); closeModal('combos'); }
        function deleteCombo(containerId, index, type) { if (isNodeLocked(type)) return; let node=getNodeByType(type); node.combos.splice(index,1); renderCombosUI(containerId, node.combos, type); commit(); }
        function updateComboNote(index, type) { if (isNodeLocked(type)) return; let noteHtml = event.target.innerHTML; let node = getNodeByType(type); node.combos[index].note = noteHtml; localStorage.setItem(DB_KEY, JSON.stringify(data)); }
        function updateMicroButtons(type, node) { 
            const idMap = { 'flop':'flop-combos-container', 'turnAction':'turn-combos-container', 'riverAction':'river-combos-container' };
            ['flop', 'turnAction', 'riverAction'].forEach(t => { 
                let nb = document.getElementById(`${t}-note-btn`); let ib = document.getElementById(`${t}-img-btn`); let lb = document.getElementById(`${t}-lock-btn`);
                if(!nb || !ib || !lb) return; let tNode = null;
                try { if (t === 'flop' && aT !== -1 && aF !== -1) tNode = data.spots[aS].textures[aT].flopNodes[aF]; else if (t === 'turnAction' && aF !== -1 && aTC !== -1 && aTA !== -1) tNode = data.spots[aS].textures[aT].flopNodes[aF].turnCards[aTC].turnActions[aTA]; else if (t === 'riverAction' && aF !== -1 && aTC !== -1 && aTA !== -1 && aRC !== -1 && aRA !== -1) { let rc = data.spots[aS].textures[aT].flopNodes[aF].turnCards[aTC].turnActions[aTA].riverCards[aRC]; if (rc && rc.riverActions) tNode = rc.riverActions[aRA]; } } catch(e) { tNode = null; }
                nb.classList.remove('has-data'); ib.classList.remove('has-data'); lb.classList.remove('locked');
                lb.innerHTML = lockSvgOpen;
                const el = document.getElementById(idMap[t]); if (el) el.classList.remove('locked-area');
                if (tNode) { if(tNode.generalNote && tNode.generalNote.trim()!=="") nb.classList.add('has-data'); if(tNode.imageData) ib.classList.add('has-data'); if(tNode.locked) { lb.classList.add('locked'); lb.innerHTML = lockSvgClosed; if (el) el.classList.add('locked-area'); } }
            }); 
        }
        function openNoteModal(type) { currentEditType=type; let node=getNodeByType(type); document.getElementById('note-textarea').innerHTML=node.generalNote||""; document.getElementById('note-textarea').contentEditable = node.locked ? 'false' : 'true'; document.getElementById('modal-nota').style.display='flex'; }
        function saveGeneralNote() { let node=getNodeByType(currentEditType); if (node.locked) { closeModal('nota'); return; } node.generalNote=document.getElementById('note-textarea').innerHTML; updateMicroButtons(currentEditType, node); commit(); closeModal('nota'); }
        function openImgModal(type) { currentEditType=type; let node=getNodeByType(type); let p=document.getElementById('img-preview'); if(node.imageData){ p.src=node.imageData;p.style.display='block'; document.getElementById('btn-subir-img').style.display= node.locked ? 'none' : 'inline-block'; document.getElementById('btn-cambiar-img').style.display= node.locked ? 'none' : 'inline-block'; document.getElementById('btn-borrar-img').style.display= node.locked ? 'none' : 'inline-block'; } else { p.style.display='none'; document.getElementById('btn-subir-img').style.display= node.locked ? 'none' : 'inline-block'; document.getElementById('btn-cambiar-img').style.display='none'; document.getElementById('btn-borrar-img').style.display='none'; } document.getElementById('modal-img').style.display='flex'; }
        function processImageFile(file) { try { let node = getNodeByType(currentEditType); if (!node || node.locked) { alert('Desbloquea el nodo.'); return; } if (!file) return; if (file.size > 15 * 1024 * 1024) { alert('Imagen demasiado grande.'); return; } const reader = new FileReader(); reader.onload = function(e) { try { const img = new Image(); img.onload = function() { try { const canvas = document.createElement('canvas'); const maxW = 1200, maxH = 1200; let w = img.width, h = img.height; if (w > maxW) { h *= maxW / w; w = maxW; } if (h > maxH) { w *= maxH / h; h = maxH; } w = Math.round(w); h = Math.round(h); canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h); let dataUrl = canvas.toDataURL('image/jpeg', 0.65); if (dataUrl.length > 3 * 1024 * 1024) dataUrl = canvas.toDataURL('image/jpeg', 0.4); node.imageData = dataUrl; updateMicroButtons(currentEditType, node); try { commit(); } catch(e) { delete node.imageData; updateMicroButtons(currentEditType, node); alert('Error guardando.'); return; } openImgModal(currentEditType); } catch(err) { alert('Error procesando.'); } }; img.onerror = function() { alert('Error cargando.'); }; img.src = e.target.result; } catch(err) { alert('Error creando img.'); } }; reader.onerror = function() { alert('Error leyendo.'); }; reader.readAsDataURL(file); } catch(err) { alert('Error.'); } }
        function handleImageUpload(event) { try { const f=event.target.files[0]; if(!f){ return; } processImageFile(f); event.target.value=''; } catch(err) { alert('Error.'); } }
        function deleteImage() { let node=getNodeByType(currentEditType); if (node.locked) return; delete node.imageData; updateMicroButtons(currentEditType,node); commit(); openImgModal(currentEditType); }
        document.addEventListener('paste', function(event) { let items = (event.clipboardData || event.originalEvent.clipboardData).items; let imgFile = null; for (let index in items) { if (items[index].type && items[index].type.indexOf('image') !== -1) { imgFile = items[index].getAsFile(); if (imgFile) break; } } if (!imgFile) return; if (document.getElementById('modal-img').style.display === 'flex') { processImageFile(imgFile); event.preventDefault(); return; } let type = 'flop'; if (aRA !== -1) type = 'riverAction'; else if (aTA !== -1) type = 'turnAction'; else if (aF === -1) { alert("Selecciona un nodo primero."); return; } currentEditType = type; processImageFile(imgFile); event.preventDefault(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'escape' && document.getElementById('card-modal').style.display === 'flex') closeCardModal(); });
    </script>
