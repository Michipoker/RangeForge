                    const g = isPair ? 'p' : key[2];
                    suitCombos(r1+r2).forEach(sc => {
                        if (g === 's' && sc.g !== 's') return;
                        if (g === 'o' && sc.g !== 'o') return;
                        if (g === 'p' && sc.g !== 'p') return;

                        const c1 = sc.id.slice(0,2).toLowerCase();
                        const c2 = sc.id.slice(2,4).toLowerCase();
                        if (!boardSet.has(c1) && !boardSet.has(c2)) count++;
                    });
                });
            } else {
                for (let i = 0; i < RANKS.length; i++) {
                    for (let j = i; j < RANKS.length; j++) {
                        suitCombos(RANKS[i] + RANKS[j]).forEach(sc => {
                            const c1 = sc.id.slice(0,2).toLowerCase();
                            const c2 = sc.id.slice(2,4).toLowerCase();
                            if (!boardSet.has(c1) && !boardSet.has(c2)) count++;
                        });
                    }
                }
            }
            return count;
        }

	        function getOrphanedIds(type) {
            try {
                let sourcePool = [];
                let parentBoard = [];
                
                if (type === 'flop') {
                    parentBoard = getActiveBoard('flop');
                    const preRange = getActivePreflopRange();
                    if (preRange.length === 0) return [];
                    preRange.forEach(key => {
                        if(!key || key.length < 2) return;
                        const r1 = key[0], r2 = key[1];
                        const isPair = r1 === r2;
                        const g = isPair ? 'p' : key[2];
                        suitCombos(r1+r2).forEach(sc => {
                            if (g === 's' && sc.g !== 's') return;
                            if (g === 'o' && sc.g !== 'o') return;
                            if (g === 'p' && sc.g !== 'p') return;
                            sourcePool.push(sc.id);
                        });
                    });
                } else if (type === 'turnAction') {
                    parentBoard = getActiveBoard('turnAction');
                    if (aF === -1) return [];
                    const flopNode = data.spots[aS].textures[aT].flopNodes[aF];
                    if (!flopNode) return []; // Aquí quité el bloqueo para que avise siempre
                    sourcePool = getAllSelectedFromNode(flopNode);
                } else if (type === 'riverAction') {
                    parentBoard = getActiveBoard('riverAction');
                    if (aF === -1 || aTC === -1 || aTA === -1) return [];
                    const turnNode = data.spots[aS].textures[aT].flopNodes[aF].turnCards[aTC].turnActions[aTA];
                    if (!turnNode) return []; // Aquí también
                    sourcePool = getAllSelectedFromNode(turnNode);
                }

                if (!parentBoard || parentBoard.length === 0) return [];
                const boardSet = new Set(parentBoard);

                const allocated = new Set();
                if (type === 'flop') {
                    data.spots[aS].textures[aT].flopNodes.forEach(n => getAllSelectedFromNode(n).forEach(id => allocated.add(id)));
                } else if (type === 'turnAction') {
                    data.spots[aS].textures[aT].flopNodes[aF].turnCards[aTC].turnActions.forEach(a => getAllSelectedFromNode(a).forEach(id => allocated.add(id)));
                } else if (type === 'riverAction') {
                    data.spots[aS].textures[aT].flopNodes[aF].turnCards[aTC].turnActions[aTA].riverCards[aRC].riverActions.forEach(a => getAllSelectedFromNode(a).forEach(id => allocated.add(id)));
                }

                const orphans = [];
                sourcePool.forEach(id => {
                    if (!id || id.length < 4) return;
                    const c1 = id.slice(0,2).toLowerCase();
                    const c2 = id.slice(2,4).toLowerCase();
                    if (boardSet.has(c1) || boardSet.has(c2)) return;
                    if (!allocated.has(id)) orphans.push(id);
                });
                return orphans;
            } catch(e) {
                console.error("Error in getOrphanedIds:", e);
                return [];
            }
        }

        function renderCombosUI(containerId, combosArr, type) {
            if(!combosArr) return;
            const isLocked = getNodeByType(type) && getNodeByType(type).locked;
            combosArr.sort((a,b) => a.sort - b.sort);
            
            let hitCount = 0, bluffCount = 0, totalSelectedInNode = 0;
            combosArr.forEach(c => {
                const count = getAllSelected(c).length;
                totalSelectedInNode += count;
                if (HIT_CATS.includes(c.id)) hitCount += count;
                else if (BLUFF_CATS.includes(c.id)) bluffCount += count;
            });
            
            const universe = getUniverse(type);
            const pctHit = universe > 0 ? (hitCount / universe * 100).toFixed(1) : '0.0';
            const pctBluff = universe > 0 ? (bluffCount / universe * 100).toFixed(1) : '0.0';
            
            const orphanCount = getOrphanedIds(type).length;
            let orphanSummaryHtml = orphanCount > 0 ? ' <span style="color: var(--bluff); font-weight: 600;">(' + orphanCount + ' sueltos)</span>' : '';
            
            let html = '<div class="range-summary">';
            html += '<span class="hit-val">Hit <b>' + hitCount + '</b> <span class="pct-group">(' + pctHit + '%)</span></span>';
            html += '<span class="bluff-val">Bluff <b>' + bluffCount + '</b> <span class="pct-group">(' + pctBluff + '%)</span></span>';
            html += '<span class="universe-val">Univ: ' + totalSelectedInNode + ' / ' + universe + orphanSummaryHtml + '</span>';
            html += '</div>';
            
            const orphanCounts = {};
            try {
                const orphans = getOrphanedIds(type);
                if (orphans.length > 0) {
                    const board = getActiveBoard(type);
                    if (board) {
                        const street = board.length;
                        orphans.forEach(id => {
                            if (!id || id.length < 4) return;
                            const c1 = id.slice(0,2).toLowerCase();
                            const c2 = id.slice(2,4).toLowerCase();
                            const cat = bestCategory([c1, c2], board, street);
                            if (!orphanCounts[cat]) orphanCounts[cat] = 0;
                            orphanCounts[cat]++;
                        });
                    }
                }
            } catch(e) { console.error("Error calculating orphans:", e); }
            
            combosArr.forEach((c,i) => {
                const isExp = c.expanded;
                const sel = getAllSelected(c);
                html += '<div class="combo-row">';
                html += '<div class="combo-name">';
                html += '<span class="combo-toggle ' + (isExp?'open':'') + '" ' + (isLocked?'style="cursor:default;pointer-events:none;"':'onclick="event.stopPropagation();toggleExpand('+i+',\''+type+'\',\''+containerId+'\')"' ) + '>' + (isExp?'▼':'▶') + '</span>';
                if (sel.length > 0) html += '<span style="font-size:8px;color:#aaa;font-weight:400">' + sel.length + '</span> ';
                html += c.name;
                if(!isLocked) {
                    const orphanCountForCat = orphanCounts[c.id] || 0;
                    if (orphanCountForCat > 0) {
                        const msg = type === 'flop' ? orphanCountForCat + ' combo(s) en el aire. Pulsa ↻ para traerlos.' : orphanCountForCat + ' combo(s) sueltos de la calle anterior. Pulsa ↻ para traerlos.';
                        html += '<span class="orphan-warning" title="' + msg + '">&#9888; ' + orphanCountForCat + '</span>';
                    }
                    html += '<span class="combo-auto-single" onclick="autoFillSingleCategory(\'' + type + '\', ' + i + ')" title="Autodetectar solo esta jugada">&#8635;</span>';
                    html += '<span class="combo-del" onclick="deleteCombo(\'' + containerId + '\', ' + i + ', \'' + type + '\')">×</span>';
                }
                html += '</div>';
                html += '<div class="combo-note" ' + (isLocked?'':'contenteditable="true"') + ' data-placeholder="..." ' + (isLocked?'':'oninput="updateComboNote('+i+',\''+type+'\')"') + ' ' + (isLocked?'':'onblur="try{this.innerHTML=colorCards(this.innerHTML)}catch(e){}"') + ' >' + (c.note||'') + '</div>';
                html += '</div>';
                if (isExp) {
                    html += '<div class="combo-expand"><div class="cards-row">';
                    sel.forEach(sid => {
                        const s1 = sid[1], s2 = sid[3], r1 = sid[0], r2 = sid[2];
                        html += '<div class="mini-combo sel" ' + (isLocked?'':'oncontextmenu="event.preventDefault();event.stopPropagation();removeCard('+i+',\''+sid+'\',\''+type+'\',\''+containerId+'\')"') + ' title="' + (isLocked?'Bloqueado':'Click der. para quitar') + '">';
                        html += '<div class="mc c' + s1 + '"><span class="mc-rank">' + r1 + '</span></div>';
                        html += '<div class="mc c' + s2 + '"><span class="mc-rank">' + r2 + '</span></div>';
                        html += '</div>';
                    });
                    if(!isLocked) html += '<div class="add-card-inline" onclick="openCardModal2(' + i + ',\'' + type + '\',\'' + containerId + '\')">+</div>';
                    html += '</div></div>';
                }
            });
            document.getElementById(containerId).innerHTML = html;

            if (type === 'flop') renderFlopTabs();
            else if (type === 'turnAction') renderTurnActionsTabs();
            else if (type === 'riverAction') renderRiverActionsTabs();
        }
        function toggleExpand(ci, type, cid) {
            if (isNodeLocked(type)) return;
            let node = getNodeByType(type);
            node.combos[ci].expanded = !node.combos[ci].expanded;
            renderCombosUI(cid, node.combos, type);
        }
        function removeCard(ci, sid, type, cid) {
            if (isNodeLocked(type)) return;
            let node = getNodeByType(type);
            removeCombo(node.combos[ci], sid);
            renderCombosUI(cid, node.combos, type);
            commit();
        }
        let cmSelectedHands = []; 
        let cmActiveTab = 's';
        const SUIT_GLYPH = { h:'♥', d:'♦', c:'♣', s:'♠' };

        let cmMouseDown = false;
        let cmDragErase = false;
        let cmDragModeAdd = false; 

        function cmSwitchTab(tab) {
            cmActiveTab = tab;
            document.querySelectorAll('#cm-tabs .cm-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            cmRenderGrid(); 
            cmRenderMatrix();
            cmRenderSelPanel();
        }

        function cmCellGroup(i, j) {
            if (i === j) return 's';
            return 'o';
        }
        function cmCellAppliesToTab(i, j, hand, tab) {
            const isPairHand = (hand[0] === hand[1]);
            if (tab === 's') {
                if (isPairHand) return false;
                return i === j;
            }
            if (tab === 'o') {
                if (isPairHand) return false;
                return i !== j;
            }
            if (tab === 'p') {
                if (!isPairHand) return false;
                if (i === j) return false;
                return j > i;
            }
            return false;
        }
        function cmUpdateTabCounts() {
            let sCount = 0, oCount = 0, pCount = 0;
            cmSelectedHands.forEach(key => {
                if (key.length > 2) {
                    if (key[2] === 's') sCount++;
                    else if (key[2] === 'o') oCount++;
                } else {
                    pCount++;
                }
            });

            ['s','o','p'].forEach(g => {
                const el = document.getElementById('cm-tab-count-' + g);
                let cnt = g === 's' ? sCount : (g === 'o' ? oCount : pCount);
                if (el) el.textContent = cnt > 0 ? '(' + cnt + ')' : '';
            });
        }

        function cmRenderGrid() {
            let ghtml = '';
            const preRange = getActivePreflopRange();
            const rangeSet = new Set(preRange);
            
            RANKS.forEach((rr, i) => {
                RANKS.forEach((cr, j) => {
                    let hand, cls, grp;
                    if (i === j) { hand = rr+cr; cls = 'cm-pair'; grp = 'p'; }
                    else if (i < j) { hand = rr+cr; cls = 'cm-suited'; grp = 's'; }
                    else { hand = cr+rr; cls = 'cm-offsuit'; grp = 'o'; }
                    
                    let selKey = hand + (grp === 'p' ? '' : grp); 
                    let rangeKey = hand + grp; 
                    
                    let disabled = (cmActiveTab === 's' && grp !== 's') || 
                                   (cmActiveTab === 'o' && grp !== 'o') || 
                                   (cmActiveTab === 'p' && grp !== 'p');
                    
                    let classes = [cls];
                    if (disabled) classes.push('cm-tab-disabled');
                    else if (preRange.length > 0 && !rangeSet.has(rangeKey)) classes.push('deleted');
                    
                    let clickAttrs = '';
                    if (!disabled && !(preRange.length > 0 && !rangeSet.has(rangeKey))) {
                        clickAttrs = `onmousedown="cmCellMouseDown(event, '${hand}', '${grp}')" onmouseover="cmCellMouseOver(event, '${hand}', '${grp}')" onmouseup="cmCellMouseUp(event, '${hand}', '${grp}')"`;
                    }
                    
                    ghtml += `<div class="cm-cell ${classes.join(' ')}" data-hand="${hand}" data-grp="${grp}" data-key="${selKey}" ${clickAttrs} title="${grp==='s'?'Suited':grp==='o'?'Offsuit':'Pares'} ${hand}">${hand}</div>`;
                });
            });
            document.getElementById('cm-grid').innerHTML = ghtml;
            cmRefreshGridData();
            cmRefreshGridActive();
        }

        function openCardModal2(ci, type, cid) {
            if (isNodeLocked(type)) return alert('Desbloquea el nodo para editar combos.');
            cmCtx = { ci, type, cid };
            cmHand = null;
            cmSelectedHands = [];
            cmActiveTab = 's';
            
            cmValidCombosSet = new Set();
            const c = getNodeByType(type).combos[ci];
            const board = getActiveBoard(type);
            if (board && board.length >= 3) {
                const excluded = getUsedSiblingsCombos(type);
                
                let sourcePool = [];
                if (type === 'flop') {
                    const preRange = getActivePreflopRange();
                    if (preRange.length > 0) {
                        preRange.forEach(key => {
                            const r1 = key[0], r2 = key[1];
                            const isPair = r1 === r2;
                            const g = isPair ? 'p' : key[2];
                            suitCombos(r1+r2).forEach(sc => {
                                if (g === 's' && sc.g !== 's') return;
                                if (g === 'o' && sc.g !== 'o') return;
                                if (g === 'p' && sc.g !== 'p') return;
                                sourcePool.push(sc.id);
                            });
                        });
                    } else {
                        for (let i = 0; i < RANKS.length; i++) {
                            for (let j = i; j < RANKS.length; j++) {
                                sourcePool.push(...suitCombos(RANKS[i] + RANKS[j]).map(sc => sc.id));
                            }
                        }
                    }
                } else if (type === 'turnAction') {
                    sourcePool = getAllSelectedFromNode(data.spots[aS].textures[aT].flopNodes[aF]);
                } else if (type === 'riverAction') {
                    sourcePool = getAllSelectedFromNode(data.spots[aS].textures[aT].flopNodes[aF].turnCards[aTC].turnActions[aTA]);
                }

                const boardSet = new Set(board);
                const validIds = [];
                sourcePool.forEach(id => {
                    if (!id || id.length < 4) return;
                    const c1 = id.slice(0,2).toLowerCase();
                    const c2 = id.slice(2,4).toLowerCase();
                    if (boardSet.has(c1) || boardSet.has(c2)) return;
                    if (excluded.has(id)) return;

                    const cat = bestCategory([c1, c2], board, board.length);
                    if (cat === c.id) validIds.push(id);
                });
                cmValidCombosSet = new Set(validIds);
            } else {
                cmValidCombosSet = null; 
            }

            document.getElementById('cm-hand-label').textContent = '—';
            document.querySelectorAll('#cm-tabs .cm-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === 's');
            });
            cmRenderGrid();
            
            document.getElementById('cm-tabs').style.display = 'flex';
            document.getElementById('cm-matrix-wrap').style.display = 'block'; 
            document.getElementById('cm-quick-actions').style.display = 'flex';
            cmRenderChips();
            document.getElementById('card-modal').style.display = 'flex';
        }

        function cmComboIdForCell(hand, i, j) {
            const r1 = hand[0], r2 = hand[1];
            if (r1 === r2) {
                if (i === j) return null;
                const lo = Math.min(i, j), hi = Math.max(i, j);
                return r1 + SUITS[lo] + r2 + SUITS[hi];
            }
            return r1 + SUITS[i] + r2 + SUITS[j];
        }
        function cmIsComboDead(id) {
            const deadSet = getDeadCards();
            return deadSet.has(id.slice(0,2).toLowerCase()) || deadSet.has(id.slice(2,4).toLowerCase());
        }
        function cmIsComboInvalidForCategory(id) {
            if (cmValidCombosSet === null) return false;
            return !cmValidCombosSet.has(id);
        }
        function cmCurrentCombo() { const node = getNodeByType(cmCtx.type); return node.combos[cmCtx.ci]; }

        function cmCellMouseDown(e, hand, group) {
            cmMouseDown = true;
            cmDragErase = false;
            const c = cmCurrentCombo();
            const hd = (c.hands||[]).find(x => x.hand === hand);
            if (hd && hd.selected && hd.selected.length > 0) {
                cmDragErase = true;
                cmEraseGroup(e.currentTarget, hand, group);
            }
            e.preventDefault();
        }
        function cmCellMouseOver(e, hand, group) {
            if (!cmMouseDown) return;
            if (cmDragErase) {
                cmEraseGroup(e.currentTarget, hand, group);
            }
        }
        function cmCellMouseUp(e, hand, group) {
            if (cmMouseDown && !cmDragErase) {
                cmToggleHand(hand, group);
            }
        }
        document.addEventListener('mouseup', function() {
            if (cmDragErase) {
                cmRefreshGridData();
                cmRenderMatrix();
                if (cmCtx) {
                    renderCombosUI(cmCtx.cid, getNodeByType(cmCtx.type).combos, cmCtx.type);
                    cmRenderSelPanel();
                }
                commit();
            }
            cmMouseDown = false;
            cmDragErase = false;
        });

        function cmEraseGroup(el, hand, group) {
            if (!cmCtx) return;
            const c = cmCurrentCombo();
            const hd = (c.hands||[]).find(x => x.hand === hand);
            if (!hd || !hd.selected || hd.selected.length === 0) return;

            const isPair = (hand[0] === hand[1]);
            let changed = false;
            hd.selected = hd.selected.filter(id => {
                const s1 = id.charAt(1).toLowerCase();
                const s2 = id.charAt(3).toLowerCase();
                let thisGroup;
                if (isPair) thisGroup = 'p';
                else thisGroup = (s1 === s2) ? 's' : 'o';
                if (thisGroup === group) {
                    changed = true;
                    return false;
                }
                return true;
            });
            if (hd.selected.length === 0) {
                c.hands = (c.hands||[]).filter(h => h.selected && h.selected.length > 0);
            }
            if (changed && el) {
                el.classList.remove('has-s', 'has-o', 'has-p');
            }
        }

        function cmToggleHand(hand, group) {
            let key = hand + (group === 'p' ? '' : group);
            const idx = cmSelectedHands.indexOf(key);
            if (idx >= 0) cmSelectedHands.splice(idx, 1);
            else cmSelectedHands.push(key);
            
            cmHand = key;
            cmRefreshGridActive();
            cmRenderChips();
        }

        function cmRefreshGridActive() {
            const set = new Set(cmSelectedHands);
            document.querySelectorAll('#cm-grid .cm-cell').forEach(el => {
                if (!el.classList.contains('deleted')) {
                    el.classList.toggle('cm-active', set.has(el.dataset.key));
                }
            });
            const lbl = cmSelectedHands.length === 0 ? '—'
                : (cmSelectedHands.length === 1 ? cmSelectedHands[0]
                : cmSelectedHands.length + ' manos');
            document.getElementById('cm-hand-label').textContent = lbl;
        }
        function cmRefreshGridData() {
            if (!cmCtx) return;
            const c = cmCurrentCombo();
            const byHand = {};
            (c.hands||[]).forEach(h => {
                if (!h.selected || h.selected.length === 0) return;
                const hand = h.hand;
                const isPair = (hand[0] === hand[1]);
                const groups = { s: false, o: false, p: false };
                h.selected.forEach(id => {
                    const s1 = id.charAt(1).toLowerCase();
                    const s2 = id.charAt(3).toLowerCase();
                    if (isPair) groups.p = true;
                    else if (s1 === s2) groups.s = true;
                    else groups.o = true;
                });
                byHand[hand] = groups;
            });
            document.querySelectorAll('#cm-grid .cm-cell').forEach(el => {
                if (el.classList.contains('deleted')) return;
                const hand = el.dataset.hand;
                const grp = el.dataset.grp;
                const g = byHand[hand];
                el.classList.toggle('has-s', grp === 's' && !!(g && g.s));
                el.classList.toggle('has-o', grp === 'o' && !!(g && g.o));
                el.classList.toggle('has-p', grp === 'p' && !!(g && g.p));
            });
        }
        function cmRenderChips() {
            const qa = document.getElementById('cm-quick-actions');
            if (qa) qa.style.display = 'flex'; 
            cmUpdateTabCounts();
            cmRenderMatrix();
            cmRenderSelPanel();
        }

        function sortComboIds(a, b) {
            const ga = a[0] === a[2] ? 'p' : (a[1] === a[3] ? 's' : 'o');
            const gb = b[0] === b[2] ? 'p' : (b[1] === b[3] ? 's' : 'o');
            const gOrder = { 's': 0, 'p': 1, 'o': 2 }; 
            if (gOrder[ga] !== gOrder[gb]) return gOrder[ga] - gOrder[gb];
            
            const r1a = RANKS.indexOf(a[0]), r2a = RANKS.indexOf(a[2]);
            const r1b = RANKS.indexOf(b[0]), r2b = RANKS.indexOf(b[2]);
            if (r1a !== r1b) return r1a - r1b;
            if (r2a !== r2b) return r2a - r2b;
            if (a[1] !== b[1]) return a[1].localeCompare(b[1]);
            if (a[3] !== b[3]) return a[3].localeCompare(b[3]);
            return 0;
        }

        function cmRenderSelPanel() {
            const panel = document.getElementById('cm-sel-panel');
            if (!panel) return;
            
            const c = cmCurrentCombo();
            const savedHands = (c.hands || []).filter(h => h.selected && h.selected.length > 0);
            
            let html = '';
            
            const board = getActiveBoard(cmCtx.type) || [];
            html += '<div class="cm-board-context"><span class="cm-board-label">Board:</span> ';
            if (board.length === 0) html += '<span class="cm-board-ph">—</span>';
            else {
                board.forEach(card => {
                    html += `<div class="mc c${card[1]}"><span class="mc-rank">${card[0].toUpperCase()}</span></div>`;
                });
            }
            html += '</div>';
            
            html += `<div class="cm-panel-title">Manos agregadas</div>`;
            
            html += `<div class="cm-hands-list">`;
            if (savedHands.length === 0) {
                html += '<div class="cm-sel-empty">Aún no has guardado combos.<br><br>Usa la matriz 4x4 para agregar.</div>';
            } else {
                savedHands.sort((a,b) => a.hand.localeCompare(b.hand));
                savedHands.forEach(h => {
                    const handStr = h.hand;
                    const r1 = handStr[0], r2 = handStr[1];
                    const isPair = (r1 === r2);
                    
                    h.selected.sort(sortComboIds);
                    let suited = h.selected.filter(id => (id[1] === id[3]) || isPair);
                    let offsuit = h.selected.filter(id => (id[1] !== id[3]) && !isPair);
                    
                    if (suited.length > 0) {
                        html += `<div class="cm-hand-row">`;
                        html += `<span class="cm-hand-label">${isPair ? handStr : handStr+'s'}</span>`;
                        html += `<div class="cm-combos-row">`;
                        suited.forEach(id => {
                            html += `<div class="mini-combo sel" oncontextmenu="event.preventDefault();event.stopPropagation();cmRemoveSavedCombo('${id}')" title="Click der. para quitar">`;
                            html += `<div class="mc c${id[1]}"><span class="mc-rank">${id[0]}</span></div>`;
                            html += `<div class="mc c${id[3]}"><span class="mc-rank">${id[2]}</span></div>`;
                            html += `</div>`;
                        });
                        html += `</div></div>`;
                    }
                    if (offsuit.length > 0) {
                        html += `<div class="cm-hand-row">`;
                        html += `<span class="cm-hand-label">${handStr+'o'}</span>`;
                        html += `<div class="cm-combos-row">`;
                        offsuit.forEach(id => {
                            html += `<div class="mini-combo sel" oncontextmenu="event.preventDefault();event.stopPropagation();cmRemoveSavedCombo('${id}')" title="Click der. para quitar">`;
                            html += `<div class="mc c${id[1]}"><span class="mc-rank">${id[0]}</span></div>`;
                            html += `<div class="mc c${id[3]}"><span class="mc-rank">${id[2]}</span></div>`;
                            html += `</div>`;
                        });
                        html += `</div></div>`;
                    }
                });
            }
            html += `</div>`;
            
            panel.innerHTML = html;
        }
        
        function cmRemoveSavedCombo(id) {
            const c = cmCurrentCombo();
            removeCombo(c, id);
            cmAfterAction();
        }

        function getAllHandsForTab(tab) {
            const hands = [];
            for (let i = 0; i < RANKS.length; i++) {
                for (let j = i; j < RANKS.length; j++) {
                    const hand = RANKS[i] + RANKS[j];
                    const isPair = (i === j);
                    if (tab === 's' && !isPair) hands.push(hand);
                    else if (tab === 'o' && !isPair) hands.push(hand);
                    else if (tab === 'p' && isPair) hands.push(hand);
                }
            }
            return hands;
        }

        function cmCellStatus(i, j) {
            let effectiveHands = [];
            if (cmSelectedHands.length > 0) {
                cmSelectedHands.forEach(key => {
                    let grp = key.length > 2 ? key[2] : 'p';
                    if (grp === cmActiveTab) {
                        effectiveHands.push(key.slice(0,2));
                    }
                });
            } else {
                effectiveHands = getAllHandsForTab(cmActiveTab);
            }
            
            if (effectiveHands.length === 0) return 'inactive';
            const c = cmCurrentCombo();
            let applicable = 0, selected = 0;
            effectiveHands.forEach(hand => {
                if (!cmCellAppliesToTab(i, j, hand, cmActiveTab)) return;
                const id = cmComboIdForCell(hand, i, j);
                if (!id) return;
                if (cmIsComboDead(id)) return;
                if (cmIsComboInvalidForCategory(id)) return; 
                applicable++;
                const hd = (c.hands||[]).find(x => x.hand === hand);
                if (hd && hd.selected && hd.selected.includes(id)) selected++;
            });
            if (applicable === 0) return 'dead';
            if (selected === applicable) return 'sel';
            if (selected > 0) return 'partial';
            return 'default';
        }
        function cmRenderMatrix() {
            const wrap = document.getElementById('cm-matrix-wrap');
            wrap.style.display = 'block'; 
            
            let effectiveHands = [];
            if (cmSelectedHands.length > 0) {
                cmSelectedHands.forEach(key => {
                    let grp = key.length > 2 ? key[2] : 'p';
                    if (grp === cmActiveTab) {
                        effectiveHands.push(key.slice(0,2));
                    }
                });
            } else {
                effectiveHands = getAllHandsForTab(cmActiveTab);
            }
            
            if (effectiveHands.length === 0) {
                wrap.innerHTML = '<div class="cm-matrix-empty">No hay manos de este tipo.</div>';
                return;
            }
            
            let html = '<div class="cm-matrix">';
            html += '<div></div>';
            SUITS.forEach(s => { html += `<div class="cm-mh suit-${s}">${SUIT_GLYPH[s]}</div>`; });
            SUITS.forEach((sRow, i) => {
                html += `<div class="cm-mh suit-${sRow}">${SUIT_GLYPH[sRow]}</div>`;
                SUITS.forEach((sCol, j) => {
                    const applies = effectiveHands.some(hand => cmCellAppliesToTab(i, j, hand, cmActiveTab));
                    const status = cmCellStatus(i, j);
                    const classes = ['cm-mcell'];
                    if (!applies) classes.push('na');
                    if (status === 'sel') classes.push('sel');
                    else if (status === 'partial') classes.push('partial');
                    else if (status === 'dead') classes.push('dead');
                    const clickable = applies && status !== 'dead';
                    const onclick = clickable ? ` onclick="cmToggleCell(${i},${j})"` : '';
                    html += `<div class="${classes.join(' ')}"${onclick} title="${cmCellTitle(status, applies)}">`;
                    html += `<span class="ms cm-ms-${sRow}">${SUIT_GLYPH[sRow]}</span>`;
                    html += `<span class="ms cm-ms-${sCol}">${SUIT_GLYPH[sCol]}</span>`;
                    html += '</div>';
                });
            });
            html += '</div>';
            html += '<div class="cm-matrix-legend">';
            html += '<span><span class="lg lg-sel"></span> Seleccionado</span>';
            html += '<span><span class="lg lg-part"></span> Parcial</span>';
            html += '<span><span class="lg lg-dead"></span> Bloqueado</span>';
            html += '</div>';
            wrap.innerHTML = html;
        }
        function cmCellTitle(status, applies) {
            if (!applies) return 'No aplica a esta pestaña';
            if (status === 'dead') return 'Bloqueado (carta muerta, eliminada o ya usada en otra pestaña)';
            if (status === 'sel') return 'Seleccionado en todas las manos — click para quitar';
            if (status === 'partial') return 'Seleccionado en algunas manos — click para completar / quitar';
            return 'Click para seleccionar en todas las manos';
        }
        function cmToggleCell(i, j) {
            const status = cmCellStatus(i, j);
            if (status === 'dead') return;
            const turnOn = status !== 'sel';
            const c = cmCurrentCombo();
            
            let effectiveHands = [];
            if (cmSelectedHands.length > 0) {
                cmSelectedHands.forEach(key => {
                    let grp = key.length > 2 ? key[2] : 'p';
                    if (grp === cmActiveTab) {
                        effectiveHands.push(key.slice(0,2));
                    }
                });
            } else {
                effectiveHands = getAllHandsForTab(cmActiveTab);
            }
            
            effectiveHands.forEach(hand => {
                if (!cmCellAppliesToTab(i, j, hand, cmActiveTab)) return;
                const id = cmComboIdForCell(hand, i, j);
                if (!id) return;
                if (cmIsComboDead(id)) return;
                if (cmIsComboInvalidForCategory(id)) return; 
                const hd = findOrCreateHand(c, hand);
                if (!hd.selected) hd.selected = [];
                const idx = hd.selected.indexOf(id);
                if (turnOn && idx < 0) {
                    hd.selected.push(id);
                }
                else if (!turnOn && idx >= 0) hd.selected.splice(idx, 1);
            });
            cmAfterAction();
        }

        function cmQuickTabAll() {
            const c = cmCurrentCombo();
            let effectiveHands = [];
            if (cmSelectedHands.length > 0) {
                cmSelectedHands.forEach(key => {
                    let grp = key.length > 2 ? key[2] : 'p';
                    if (grp === cmActiveTab) {
                        effectiveHands.push(key.slice(0,2));
                    }
                });
            } else {
                effectiveHands = getAllHandsForTab(cmActiveTab);
            }
            
            effectiveHands.forEach(hand => {
                if (cmActiveTab === 'p' && hand[0] !== hand[1]) return;
                if (cmActiveTab !== 'p' && hand[0] === hand[1]) return;
                const hd = findOrCreateHand(c, hand);
                if (!hd.selected) hd.selected = [];
                suitCombos(hand).forEach(sc => {
                    if (cmActiveTab === 's' && sc.g !== 's') return;
                    if (cmActiveTab === 'o' && sc.g !== 'o') return;
                    if (cmActiveTab === 'p' && sc.g !== 'p') return;
                    if (cmIsComboDead(sc.id)) return;
                    if (cmIsComboInvalidForCategory(sc.id)) return; 
                    if (!hd.selected.includes(sc.id)) {
                        hd.selected.push(sc.id);
                    }
                });
            });
            cmAfterAction();
        }
        function cmQuickNone() {
            const c = cmCurrentCombo();
            let effectiveHands = [];
            if (cmSelectedHands.length > 0) {
                cmSelectedHands.forEach(key => {
                    let grp = key.length > 2 ? key[2] : 'p';
                    if (grp === cmActiveTab) {
                        effectiveHands.push(key.slice(0,2));
                    }
                });
            } else {
                effectiveHands = getAllHandsForTab(cmActiveTab);
            }
            
            effectiveHands.forEach(hand => {
                if (cmActiveTab === 'p' && hand[0] !== hand[1]) return;
                if (cmActiveTab !== 'p' && hand[0] === hand[1]) return;
                const hd = findOrCreateHand(c, hand);
                if (!hd.selected) hd.selected = [];
                hd.selected = hd.selected.filter(id => {
                    const s1 = id.charAt(1).toLowerCase();
                    const s2 = id.charAt(3).toLowerCase();
                    const isPair = (id[0] === id[2]);
                    if (cmActiveTab === 'p') return !isPair;
                    if (isPair) return true;
                    if (cmActiveTab === 's') return s1 !== s2;
                    return s1 === s2;
                });
            });
            cmAfterAction();
        }
        function cmAfterAction() {
            cmRefreshGridData();
            cmRenderMatrix();
            renderCombosUI(cmCtx.cid, getNodeByType(cmCtx.type).combos, cmCtx.type);
            commit();
            cmRenderSelPanel();
        }

        function closeCardModal() {
            document.getElementById('card-modal').style.display = 'none';
            if (cmCtx) {
                let node = getNodeByType(cmCtx.type);
                node.combos[cmCtx.ci].hands = (node.combos[cmCtx.ci].hands||[]).filter(h => h.selected && h.selected.length > 0);
                renderCombosUI(cmCtx.cid, node.combos, cmCtx.type);
                commit();
            }
            cmCtx = null; cmHand = null; cmSelectedHands = [];
        }

        function openComboModal(type) { 
            if (isNodeLocked(type)) return alert('Desbloquea el nodo para agregar jugadas.');
            currentEditType=type; 
            let node=getNodeByType(type); 
            if (!node) return;
            if (!node.combos) node.combos = [];
            let existingIds=node.combos.map(c=>c.id); 
            let available=COMBOS_MASTER.filter(m=>!existingIds.includes(m.id)).sort((a,b)=>a.sort-b.sort); 
            let html=''; 
            available.forEach(m=>{html+=`<label class="combo-check-item"><input type="checkbox" value="${m.id}">${m.name}</label>`;}); 
            if(!html) html='<p style="color:#aaa;text-align:center">Todas agregadas.</p>'; 
            document.getElementById('combo-check-list').innerHTML=html; 
            document.getElementById('modal-combos').style.display='flex'; 
        }
        function confirmAddCombos() { let cbs=document.querySelectorAll('#combo-check-list input[type="checkbox"]:checked'); let node=getNodeByType(currentEditType); cbs.forEach(cb=>{let m=COMBOS_MASTER.find(x=>x.id===cb.value);if(m) node.combos.push({id:m.id, name:m.name, sort:m.sort, note:""});}); let idMap = {'flop':'flop-combos-container', 'turnAction':'turn-combos-container', 'riverAction':'river-combos-container'}; renderCombosUI(idMap[currentEditType], node.combos, currentEditType); commit(); closeModal('combos'); }
        function deleteCombo(containerId, index, type) { if (isNodeLocked(type)) return; let node=getNodeByType(type); node.combos.splice(index,1); renderCombosUI(containerId, node.combos, type); commit(); }

        function updateComboNote(index, type) {
            if (isNodeLocked(type)) return;
            let noteHtml = event.target.innerHTML;
            let node = getNodeByType(type);
            node.combos[index].note = noteHtml;
            localStorage.setItem(DB_KEY, JSON.stringify(data)); 
        }

        function updateMicroButtons(type, node) { 
            const idMap = { 'flop':'flop-combos-container', 'turnAction':'turn-combos-container', 'riverAction':'river-combos-container' };
            
            ['flop', 'turnAction', 'riverAction'].forEach(t => { 
                let nb = document.getElementById(`${t}-note-btn`); 
                let ib = document.getElementById(`${t}-img-btn`); 
                let lb = document.getElementById(`${t}-lock-btn`);
                if(!nb || !ib || !lb) return; 
                
                let tNode = null;
                try {
                    if (t === 'flop' && aT !== -1 && aF !== -1) tNode = data.spots[aS].textures[aT].flopNodes[aF];
                    else if (t === 'turnAction' && aF !== -1 && aTC !== -1 && aTA !== -1) tNode = data.spots[aS].textures[aT].flopNodes[aF].turnCards[aTC].turnActions[aTA];
                    else if (t === 'riverAction' && aF !== -1 && aTC !== -1 && aTA !== -1 && aRC !== -1 && aRA !== -1) {
                        let riverCard = data.spots[aS].textures[aT].flopNodes[aF].turnCards[aTC].turnActions[aTA].riverCards[aRC];
                        if (riverCard && riverCard.riverActions) {
                            tNode = riverCard.riverActions[aRA];
                        }
                    }
                } catch(e) { tNode = null; }

                nb.classList.remove('has-data'); 
                ib.classList.remove('has-data');
                lb.classList.remove('locked');
                lb.innerHTML = lockSvgOpen;
                
                const el = document.getElementById(idMap[t]);
                if (el) el.classList.remove('locked-area');
                
                if (tNode) {
                    if(tNode.generalNote && tNode.generalNote.trim()!=="") nb.classList.add('has-data'); 
                    if(tNode.imageData) ib.classList.add('has-data'); 
                    if(tNode.locked) {
                        lb.classList.add('locked');
                        lb.innerHTML = lockSvgClosed;
                        if (el) el.classList.add('locked-area');
                    }
                }
            }); 
        }
        function openNoteModal(type) { 
            currentEditType=type; 
            let node=getNodeByType(type); 
            document.getElementById('note-textarea').innerHTML=colorCards(node.generalNote||""); 
            document.getElementById('note-textarea').contentEditable = node.locked ? 'false' : 'true';
            document.getElementById('modal-nota').style.display='flex'; 
        }
        function saveGeneralNote() {
            let node=getNodeByType(currentEditType);
            if (node.locked) { closeModal('nota'); return; }
            node.generalNote=document.getElementById('note-textarea').innerHTML;
            updateMicroButtons(currentEditType, node);
            commit();
            closeModal('nota');
        }
        function openImgModal(type) { 
            currentEditType=type; 
            let node=getNodeByType(type); 
            let p=document.getElementById('img-preview'); 
            if(node.imageData){
                p.src=node.imageData;p.style.display='block';
                document.getElementById('btn-subir-img').style.display= node.locked ? 'none' : 'inline-block';
                document.getElementById('btn-cambiar-img').style.display= node.locked ? 'none' : 'inline-block';
                document.getElementById('btn-borrar-img').style.display= node.locked ? 'none' : 'inline-block';
            } else { 
                p.style.display='none';
                document.getElementById('btn-subir-img').style.display= node.locked ? 'none' : 'inline-block';
                document.getElementById('btn-cambiar-img').style.display='none';
                document.getElementById('btn-borrar-img').style.display='none';
            } 
            document.getElementById('modal-img').style.display='flex'; 
        }
        function processImageFile(file) {
            try {
                let node = getNodeByType(currentEditType);
                if (!node || node.locked) { alert('Desbloquea el nodo para subir imágenes.'); return; }
                if (!file) { alert('No se recibió archivo.'); return; }
                if (file.size > 15 * 1024 * 1024) {
                    alert('Imagen demasiado grande (' + (file.size/1024/1024).toFixed(1) + 'MB). Maximo 15MB. Reducila antes de subirla.');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const img = new Image();
                        img.onload = function() {
                            try {
                                const canvas = document.createElement('canvas');
                                const maxWidth = 1200;
                                const maxHeight = 1200;
                                let w = img.width, h = img.height;
                                if (w > maxWidth) { h *= maxWidth / w; w = maxWidth; }
                                if (h > maxHeight) { w *= maxHeight / h; h = maxHeight; }
                                w = Math.round(w); h = Math.round(h);
                                canvas.width = w;
                                canvas.height = h;
                                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                                
                                if (!node) { alert('Error: no hay nodo activo.'); return; }
                                let dataUrl = canvas.toDataURL('image/jpeg', 0.65);
                                if (dataUrl.length > 3 * 1024 * 1024) {
                                    dataUrl = canvas.toDataURL('image/jpeg', 0.4);
                                }
                                if (dataUrl.length > 3 * 1024 * 1024) {
                                    const sw = Math.round(w * 0.6), sh = Math.round(h * 0.6);
                                    canvas.width = sw; canvas.height = sh;
                                    canvas.getContext('2d').drawImage(img, 0, 0, sw, sh);
                                    dataUrl = canvas.toDataURL('image/jpeg', 0.4);
                                }
                                node.imageData = dataUrl;
                                updateMicroButtons(currentEditType, node);
                                try { 
                                    commit(); 
                                } catch(e) { 
                                    delete node.imageData;
                                    updateMicroButtons(currentEditType, node);
                                    alert('No se pudo guardar la imagen. El almacenamiento del navegador esta lleno.\n\nSolucion: borra imagenes viejas o exporta la DB y limpia el navegador.\n\nError: ' + e.message);
                                    return;
                                }
                                openImgModal(currentEditType);
                            } catch(err) { alert('Error al procesar imagen: ' + err.message); }
                        };
                        img.onerror = function() { alert('Error: no se pudo cargar la imagen.'); };
                        img.src = e.target.result;
                    } catch(err) { alert('Error al crear imagen: ' + err.message); }
                };
                reader.onerror = function() { alert('Error al leer el archivo.'); };
                reader.readAsDataURL(file);
            } catch(err) { alert('Error en processImageFile: ' + err.message); }
        }
        function handleImageUpload(event) {
            try {
                const f=event.target.files[0];
                if(!f){ return; }
                processImageFile(f);
                event.target.value='';
            } catch(err) { alert('Error en handleImageUpload: ' + err.message); }
        }
        function deleteImage() { 
            let node=getNodeByType(currentEditType); 
            if (node.locked) return;
            delete node.imageData; 
            updateMicroButtons(currentEditType,node); 
            commit(); 
            openImgModal(currentEditType); 
        }
        document.addEventListener('paste', function(event) {
            let items = (event.clipboardData || event.originalEvent.clipboardData).items;
            let imgFile = null;
            for (let index in items) {
                if (items[index].type && items[index].type.indexOf('image') !== -1) {
                    imgFile = items[index].getAsFile();
                    if (imgFile) break;
                }
            }
            if (!imgFile) return;
            if (document.getElementById('modal-img').style.display === 'flex') {
                processImageFile(imgFile);
                event.preventDefault();
                return;
            }
            let type = 'flop';
            if (aRA !== -1) type = 'riverAction';
            else if (aTA !== -1) type = 'turnAction';
            else if (aF === -1) { alert("Selecciona un nodo primero para pegar la imagen."); return; }
            currentEditType = type;
            processImageFile(imgFile);
            event.preventDefault();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'escape' && document.getElementById('card-modal').style.display === 'flex') closeCardModal();
        });
    </script>
